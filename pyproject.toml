# Build backend: scikit-build-core. It drives src/vidmag/cuda/CMakeLists.txt, which builds
# the optional _vidmag_cuda extension. That CMakeLists configures cleanly and
# defines no target when there is no CUDA compiler, so `pip install .` succeeds
# on any machine and produces a working CPU-only package; with nvcc present the
# same command also compiles and installs the GPU extension.
[build-system]
# pybind11 is a build requirement, not a runtime one. Without it here,
# src/vidmag/cuda/CMakeLists.txt falls back to downloading pybind11 from GitHub during the
# build, which turns `pip install` into something that needs network access and
# a working git. Declaring it lets pip supply it from a wheel instead.
requires = ["scikit-build-core>=1.0", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "vidmag"
version = "0.2.0"
description = "Eulerian Video Magnification: reveal colour and motion changes in video too small to see. Hand-written CUDA at the core, five more backends so it runs anywhere."
readme = "README.md"
requires-python = ">=3.9"
# PEP 639 form, replacing the deprecated `license = { text = ... }` table that
# setuptools stops accepting on 2027-02-18. The licence itself is UNCHANGED:
# BSD-3-Clause-NonCommercial has no SPDX/OSI identifier (no non-commercial
# variant does), so it is expressed as a custom LicenseRef. LICENSE remains the
# authoritative text and ships in the wheel and sdist.
license = "LicenseRef-BSD-3-Clause-NonCommercial"
license-files = ["LICENSE"]
authors = [{ name = "Furkan Kucuk" }]
keywords = [
    "eulerian-video-magnification",
    "motion-magnification",
    "video-magnification",
    "photoplethysmography",
    "remote-ppg",
    "vibration-analysis",
    "computer-vision",
    "video-processing",
    "cuda",
    "gpu",
]
# Deliberately no per-version Python classifiers: only 3.13 and 3.14 have been
# run against this tree, and `requires-python` already states the floor.
# Deliberately no Windows classifier: never tested there (the RTX 3090 host runs
# the suite inside WSL2, which is Linux).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.8",
    "requests>=2.31",
    "av>=14.0.0",
]

[project.optional-dependencies]
# Everything needed to compile the CUDA extension WITHOUT pip's build isolation,
# which is what `make build` uses. nvcc and the CUDA toolkit still come from the
# system. A plain isolated `pip install .` needs none of this: pip installs the
# backend from [build-system].requires and scikit-build-core fetches cmake/ninja
# itself when the system copies are missing or too old.
cuda-build = [
    "scikit-build-core>=1.0",
    "cmake>=3.24",
    "ninja",
    "pybind11>=2.10",
]
# The portable backend. pyopencl is the Python binding; the OpenCL driver
# itself comes from the operating system or the graphics vendor, so installing
# this extra is necessary but not always sufficient — vidmag.opencl.runtime says
# which of the two is missing.
opencl = [
    "pyopencl>=2024.1",
]
# Apple's own graphics interface, through the Objective-C bridge. macOS only;
# there is nothing to install elsewhere, and vidmag.metal.runtime says so rather
# than failing obscurely.
metal = [
    "pyobjc-framework-Metal>=10.0; sys_platform == 'darwin'",
]
# Vulkan. The bindings come from here; the loader and driver come from the
# operating system or the graphics vendor. On macOS the driver is MoltenVK,
# which translates Vulkan to Metal: brew install molten-vk vulkan-loader.
vulkan = [
    "vulkan>=1.3",
]
# PyTorch. Not how this project reaches any vendor's hardware — the OpenCL,
# Vulkan and Apple backends do that with no framework at all. This is for
# people who already have PyTorch set up, and for keeping results as tensors so
# magnification can sit inside a larger tensor computation. Nothing imports it
# unless backend="torch" is asked for.
torch = [
    "torch>=2.0",
]
# Building the documentation site. mkdocstrings reads docstrings out of the
# installed package, so the API reference cannot be built without the project
# itself installed alongside these.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]
dev = [
    "pytest>=7.0",
    # Coverage is reported, not gated, and the reason is structural: no single
    # machine can run this whole library. A machine with an NVIDIA card has no
    # Apple graphics interface; a Mac has no NVIDIA extension. Each run
    # therefore reports a number near 65% while showing the other backend's
    # files at zero, and a threshold would only measure which machine ran it.
    # The union across machines is what matters, and reading it is a human job
    # until the per-machine reports are merged.
    "pytest-cov>=4.0",
]
# Pinned, not floating: a new ruff release adds rules, and a lint gate that can
# turn red without anybody editing code is a gate people learn to ignore.
# .pre-commit-config.yaml pins the same ruff version; bump both together.
lint = [
    "ruff==0.16.5",
    "mypy==2.3.0",
]

# The console command. `evm` was rejected as the command name (plan decision
# D5) because it collides with Ethereum tooling, which already owns that name
# on PATH for a lot of people. Subcommands: magnify / stream / bench / download.
[project.scripts]
vidmag = "vidmag._cli:main"

[project.urls]
Homepage = "https://iamkucuk.github.io/eulerian-video-magnification-cuda/"
Repository = "https://github.com/iamkucuk/eulerian-video-magnification-cuda"
Issues = "https://github.com/iamkucuk/eulerian-video-magnification-cuda/issues"

[tool.scikit-build]
# Freeze the backend's default behaviour at the version named in
# [build-system].requires, so a later scikit-build-core release cannot silently
# change how this project builds.
minimum-version = "build-system.requires"
# The CMake project lives beside the Python it builds for, in src/vidmag/cuda/,
# so every backend's kernels are found in that backend's directory.
# `cmake.version` is deliberately left unset: scikit-build-core then reads the
# requirement from that file's cmake_minimum_required(VERSION 3.24) instead of
# duplicating the number here.
cmake.source-dir = "src/vidmag/cuda"
# Pure-Python packages are copied from src/ as-is. The compiled extension is
# placed beside them by `install(TARGETS _vidmag_cuda LIBRARY DESTINATION vidmag/cuda)`
# in src/vidmag/cuda/CMakeLists.txt, so it lands at vidmag/cuda/_vidmag_cuda*.so.
wheel.packages = ["src/vidmag"]
# The NVIDIA sources live inside the package so that each backend's kernels sit
# in that backend's directory, but they are BUILD inputs: nvcc turns them into
# the extension at install time and nothing reads them afterwards. They are
# excluded from the wheel for that reason, and kept in the sdist below, which
# is what someone building from source needs. The other backends' kernels are
# the opposite case — their drivers compile them at run time — so those ship.
# Paths here are relative to the WHEEL root, where the package installs as
# vidmag/cuda/ — not to the source tree, which is src/vidmag/cuda/.
wheel.exclude = [
    "vidmag/cuda/CMakeLists.txt",
    "vidmag/cuda/DESIGN.md",
    "vidmag/cuda/bindings.cpp",
    "vidmag/cuda/kernels/*",
    "vidmag/cuda/include/*",
]
# The kernels are not Python files, so they need naming explicitly or the wheel
# would install a package whose backends have nothing to compile or run: the
# Vulkan shaders are compiled ahead of time into SPIR-V and shipped so that
# installing needs no shader compiler, while the OpenCL and Metal kernels are
# compiled by their own drivers at run time from these sources.
sdist.include = [
    "src/vidmag/cuda/CMakeLists.txt",
    "src/vidmag/cuda/bindings.cpp",
    "src/vidmag/cuda/kernels/*.cu",
    "src/vidmag/cuda/include/*.cuh",
    "src/vidmag/vulkan/shaders/*.spv",
    "src/vidmag/vulkan/shaders/*.comp",
    "src/vidmag/opencl/*.cl",
    "src/vidmag/metal/*.metal",
]

[tool.pytest.ini_options]
# No `pythonpath` entry on purpose: the tests import the INSTALLED package
# (`pip install -e ".[dev]"`), which is what makes them a real check on the
# packaging. A source checkout with nothing installed is expected to fail with
# ModuleNotFoundError; scripts/dev/verify_install.sh exercises the clean path.
testpaths = ["tests"]

# --------------------------------------------------------------------------
# Ruff (plan step 2.2). Configured to describe the code that is already here,
# not to impose a new house style on it: the settings below were chosen by
# measuring, on 2026-08-09, what each candidate produced against this tree.
# --------------------------------------------------------------------------
[tool.ruff]
# Measured, not chosen by taste. `ruff format --check` over the tracked *.py
# files at 88 / 100 / 110 columns leaves 14 / 11 / 10 of them already
# byte-identical to the formatter's output (25 / 21 / 20 counting the whole
# tree, which adds .pyi and the notebook). 88 is not merely the best score: it
# is the only width at which all of src/vidmag/backend/ and presets.py — the most
# recently written modules — come out unchanged, 5 of 5 files, against 2 and 3
# reformatted at 100 and 110. A wider limit scores *worse* because the
# formatter then joins lines that were wrapped by hand.
line-length = 88

[tool.ruff.lint]
# The pyflakes + pycodestyle-error core, i.e. the rules that find real defects
# (undefined and unused names, comparison and except-clause mistakes, syntax
# errors) rather than rules that would restyle working code. Ruff's own default
# selection is far wider (413 rules in 0.16.2) and reports 265 findings here,
# almost all of them "this file was written before that rule existed".
#
# Deliberately NOT selected, with the count each would add today:
#   I    (import sorting)      35 files — this tree groups imports by meaning
#                              (siblings, then parents), not by isort's order.
#   UP   (pyupgrade)           29 — typing.Callable -> collections.abc, etc.
#                              A real modernisation, but a source rewrite, so
#                              it belongs in its own commit, not in the commit
#                              that turns the linter on.
#   RET/PLR1711                36 — explicit `return None` in the batched.py
#                              stage closures, where returning nothing on
#                              purpose is the point.
#   C4   (comprehensions)      18 — `dict(alpha=..., level=...)` in the golden
#                              fixture table and the CLI tests, which reads
#                              better than a brace literal for a parameter set.
#   RUF022                     5  — `__all__` is ordered by topic here, not
#                              alphabetically, and the topic order is the docs'.
#   BLE001                     6  — every one is a boundary that catches broad
#                              and then *reports* (backend probes,
#                              nvidia-smi shelling out, CUDA import guards).
#                              E722 below still forbids a truly bare `except:`.
select = ["E4", "E7", "E9", "F", "W", "RUF100"]

ignore = [
    # `l` is the pyramid level index, spelled exactly as the MATLAB reference
    # spells it (`for l = nLevels:-1:1` in amplify_spatial_lpyr_temporal_*.m).
    # 23 sites across the CPU baseline, the CUDA wrappers and their tests use
    # it. The port is deliberately name-for-name with the reference, so this is
    # a convention to keep, not a violation to annotate 23 times.
    "E741",
    # `t0 = time.perf_counter(); body()` — the benchmark and profiling code
    # pairs a timer with the statement it times on one line, 41 times, so the
    # pairing is visible at a glance. Nothing about it is ambiguous.
    "E702",
]

[tool.ruff.lint.per-file-ignores]
# `import vidmag` with nothing used from it: importing the oracle is the point,
# because a missing install must fail here, loudly, before any CUDA test runs.
"tests/cuda/conftest.py" = ["F401"]
# 36 false positives, one cause. This module frees pooled device memory as soon
# as a stage is done with it — `_stage("2) blur_dn", _s2); del d_ntsc_planar` —
# and every stage body is a closure defined just above its own `del`. Ruff
# checks a nested function body against the *final* state of the enclosing
# scope, by which time the name is unbound, so it calls a name undefined that
# was live when the closure actually ran. Reduced and confirmed on 2026-08-09:
#
#     def run():
#         buf = "payload"
#         def body(): return buf.upper()   # ruff: F821 Undefined name `buf`
#         result = body()                  # ... yet this prints PAYLOAD
#         del buf
#         return result
#
# All 36 are this shape: every name ruff reports (d_clip, d_ntsc_planar,
# d_gdown_planar, d_gdown_thwc, d_sig, d_filt, d_filtered, d_bands) is the
# target of a `del` in its own function. Scoped to this one file so F821 keeps
# working everywhere else.
"src/vidmag/cuda/batched.py" = ["F821"]

[tool.ruff.format]
# THE DEBT LIST, and the only place it is written down. `ruff format` was never
# run over this repository. Measured with `ruff format --diff` on 2026-08-09,
# before this key existed: "42 files would be reformatted, 24 files already
# formatted", and the 42 amount to about 2100 moved lines — enough to bury the
# work of this branch. So the formatter is switched on for everything EXCEPT the
# 42 named below, which makes it a real gate today and puts every new file in
# scope automatically, because this list names files and not a directory.
# With the list in place, `ruff format --diff .` produces no output at all.
#
# Delete a line from this list in the same commit that formats that file.
# The list only ever shrinks; when it is empty, delete `exclude` with it.
#
# One source of truth on purpose: CI (.github/workflows/lint.yml), the
# pre-commit hook and an editor's format-on-save all read this key, so none of
# them can disagree about which files are in scope.
exclude = [
    "scripts/cloud/colab_benchmark.ipynb",
    "scripts/cloud/kaggle/run_gpu_comparison.py",
    "scripts/experiments/bound_microbench.py",
    "scripts/dev/make_golden_fixtures.py",
    "scripts/download_samples.py",
    "scripts/experiments/measure_fp16_experiments.py",
    "scripts/profile_full_comparison.py",
    "scripts/experiments/prove_fp16_cost.py",
    "scripts/render_cuda_videos.py",
    "src/vidmag/__init__.py",
    "src/vidmag/_cli.py",
    "src/vidmag/api.py",
    "src/vidmag/cpu/filters.py",
    "src/vidmag/cpu/magnify.py",
    "src/vidmag/cpu/pyramids.py",
    "src/vidmag/cuda/__init__.py",
    "src/vidmag/cuda/_common.py",
    "src/vidmag/cuda/batched.py",
    "src/vidmag/cuda/benchmark.py",
    "src/vidmag/cuda/pipelines.py",
    "src/vidmag/cuda/runtime.py",
    "src/vidmag/io/h264.py",
    "src/vidmag/io/video.py",
    "src/vidmag/notebook.py",
    "tests/__init__.py",
    "tests/cuda/conftest.py",
    "tests/cuda/test_api_cuda.py",
    "tests/cuda/test_batched_kernels.py",
    "tests/cuda/test_benchmark.py",
    "tests/cuda/test_color_cvt.py",
    "tests/cuda/test_device_resident_bandpass.py",
    "tests/cuda/test_lpyr.py",
    "tests/cuda/test_pipelines.py",
    "tests/cuda/test_spatial.py",
    "tests/cuda/test_temporal.py",
    "tests/cuda/test_upsample.py",
    "tests/test_api.py",
    "tests/test_cli.py",
    "tests/test_golden.py",
    "tests/test_pipeline.py",
    "tests/test_pyramids.py",
    "tests/test_video_encode.py",
]

# --------------------------------------------------------------------------
# Mypy (plan step 2.3): permissive everywhere under src/vidmag, strict on the
# public surface only. Measured on 2026-08-09 with mypy 2.3.0 on this Mac:
# permissive alone gives 22 errors in 6 files; adding the strict surface below
# gives 28 in 7. The +6 are all in vidmag/api.py and vidmag/__init__.py —
# vidmag.presets and every module of vidmag.backend already pass strict unchanged.
# --------------------------------------------------------------------------
[tool.mypy]
# Where the packages live. Without this, a test importing `vidmag.cpu.ops` is
# resolved against the installed copy rather than the source tree, and mypy
# reports the submodule as missing when it is right there in src/.
mypy_path = "src"
# The tests and helper scripts are checked too, not just the shipped library.
# A test that calls a function with the wrong argument types still passes if it
# never reaches that line, so the checker is the only thing that catches it.
# They are held to a lighter standard than src/vidmag: the strict flags are
# opted into per module, and only for the public library surface.
files = ["src/vidmag", "tests", "scripts"]
# Pinned rather than "whatever interpreter is running", so a local run and CI
# cannot reach different verdicts.
#
# It must be 3.12 or higher, and that is a hard constraint, not a preference:
# mypy parses third-party stubs with the grammar of THIS version, and numpy
# >= 2.5 writes PEP 695 `type X = ...` statements in its `__init__.pyi`. At
# 3.10 or 3.11, mypy stops at
#     numpy/__init__.pyi:737: error: Type statement is only supported in
#     Python 3.12 and greater  [syntax]
#     Found 1 error in 1 file (errors prevented further checking)
# — it type-checks NOTHING and the job is red for a reason that has nothing to
# do with this code. A machine with numpy 2.4 installed does not see this, so
# it hides from a local run and only appears on a fresh `pip install .[lint]`,
# which is exactly what CI does. Verified on 2026-08-09 against both numpy
# 2.4.6 and 2.5.2: at 3.12 and 3.13 both give the same 28 errors in 7 files;
# at 3.10 and 3.11, numpy 2.5.2 gives the syntax error above.
#
# 3.12 and not the 3.9 floor in `requires-python`: mypy 2.3.0 refuses 3.9
# outright ("Python 3.9 is not supported (must be 3.10 or higher)"), and 3.10
# and 3.11 are ruled out above. So nothing here checks the 3.9 promise — and
# nothing else does either, since this tree has only ever been run on 3.13 and
# 3.14. Worth resolving when the classifier list is revisited.
python_version = "3.12"
# numpy ships types; cv2, av, scipy and the compiled _vidmag_cuda do not. Hunting
# stubs for four third-party libraries is not what this step is for.
ignore_missing_imports = true
warn_unused_configs = true
# Global-only in mypy 2.3.0 — it is part of what `strict` turns on, but a
# per-module section rejects it ("Per-module sections should only specify
# per-module flags"), so it lives up here and applies everywhere.
warn_redundant_casts = true
# The one suppression that must never go stale: a `# type: ignore` that stopped
# being needed is how a silenced error outlives its cause.
warn_unused_ignores = true

# The public surface: what `import vidmag` gives you, plus the contract every
# future backend implements. Semver covers exactly these names (plan section 1,
# item 4), so these are the names worth checking properly.
#
# The strict flags are spelled out one by one instead of `strict = true`.
# That is not verbosity for its own sake — `strict = true` inside an overrides
# table does NOT stay inside it. Verified on 2026-08-09 with mypy 2.3.0: a
# config whose only override was `module = ["vidmag.presets"], strict = true`
# still reported 131 errors in 13 files, 65 of them in vidmag/cuda/batched.py — a
# module the override never named — broken down as 28 no-untyped-call, 24
# no-untyped-def, 12 no-any-return and 1 attr-defined. Spelled out, the same
# surface reports 28 in 7 — the strictness lands where it was aimed.
[[tool.mypy.overrides]]
module = [
    "vidmag",
    "vidmag.api",
    "vidmag.presets",
    "vidmag.backend",
    "vidmag.backend.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# No override for the tests and helper scripts, and that is deliberate rather
# than an omission. The strict flags above are opted into per module for the
# public library surface only; everything else is checked at mypy's default
# level, which still catches undefined attributes, wrong argument types and
# impossible returns. Requiring full annotations on a test function buys
# nothing — its job is to be a readable assertion, and pytest fails it if the
# behaviour is wrong.
#
# An override did live here and did nothing. It matched on `test_*`,
# `profile_*`, `render_*`, `bound_*`, `measure_*` and `prove_*`; mypy requires a
# `*` to be a whole dotted component and rejected all six with "Patterns must be
# fully-qualified module names", printing that on every run. Verified 2026-08-18
# by deleting the block: the result is unchanged at "no issues found in 88
# source files". If a strict flag is ever moved into the global section, this is
# where the exemption would have to be written, one exact module name per entry.
